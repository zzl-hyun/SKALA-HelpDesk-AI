spring:
  application:
    name: helpdesk-agent

  datasource:
    url: jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small

    chat:
      observations:
        log-prompt: false
      client:
        observations:
          log-prompt: false

server:
  port: 8080

helpdesk:
  rag:
    chunk-size: ${HELPDESK_CHUNK_SIZE:400}
    min-chunk-size-chars: ${HELPDESK_MIN_CHUNK_SIZE_CHARS:200}
    top-k: ${HELPDESK_TOP_K:4}
    similarity-threshold: ${HELPDESK_SIMILARITY_THRESHOLD:0.33}
  memory:
    max-messages: ${HELPDESK_MEMORY_MAX_MESSAGES:20}

# ── API 문서  Swagger UI ──────────────────────────────────
#   화면 http://localhost:8080/swagger-ui.html   문서 /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: helpdesk-agent

logging:
  level:
    com.skala.helpdesk: DEBUG
