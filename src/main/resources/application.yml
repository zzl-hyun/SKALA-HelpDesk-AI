spring:
  application:
    name: assistant-agent

  # H2 — 실습용. 앱 재시작하면 초기화되고 DataSeeder(CommandLineRunner)가 다시 씨딩한다.
  datasource:
    url: jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop   # 실습용 — 스키마를 Hibernate가 매번 새로 만든다.
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console   # 브라우저에서 데이터 직접 확인용 — JDBC URL: jdbc:h2:mem:helpdesk

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  export OPENAI_API_KEY="sk-..."
      # 기본값이 있어 키가 없어도 앱은 뜬다 — 실제 모델 호출 시점에만 401 이 난다.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small

    # 운영에서는 프롬프트 원문 로깅을 반드시 끈다(개인정보가 그대로 쌓인다).
    chat:
      observations:
        log-prompt: false
      client:
        observations:
          log-prompt: false

server:
  port: 8080

# Day 2 RAG 실험값. 환경 변수 하나만 바꾸고 다시 인제스트하면 조합을 비교할 수 있다.
lab2:
  rag:
    chunk-size: ${LAB2_CHUNK_SIZE:400}
    min-chunk-size-chars: ${LAB2_MIN_CHUNK_SIZE_CHARS:200}
    top-k: ${LAB2_TOP_K:4}
    similarity-threshold: ${LAB2_SIMILARITY_THRESHOLD:0.33}

# ── API 문서 · Swagger UI ──────────────────────────────────
#   화면 http://localhost:8080/swagger-ui.html   문서 /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: assistant-agent

logging:
  level:
    com.skala.ch03: DEBUG
