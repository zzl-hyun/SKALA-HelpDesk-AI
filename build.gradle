plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.skala'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }
tasks.named('bootRun') { jvmArgs = ['-Dfile.encoding=UTF-8'] }

repositories {
    maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    mavenCentral()
}


ext {
    springAiVersion = '1.1.8'
}

dependencies {
    // ── 웹  문서 ──────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'    // /swagger-ui.html
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'                  // /actuator/prometheus

    // ── 영속성 (JPA  H2) ─────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    // ── Spring AI ─────────────────────────────────────────────
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-vector-store'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'     // VectorStore

    // ── 테스트 ─────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports { mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}" }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat().aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('compileJava') { dependsOn 'spotlessApply' }

tasks.named('test') {
    useJUnitPlatform {
        if (!project.hasProperty('eval')) {
            excludeTags 'eval'
        }
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = project.hasProperty('eval')
    }
    if (project.hasProperty('eval')) {
        outputs.upToDateWhen { false }
    }
}

springBoot { mainClass = 'com.skala.helpdesk.HelpDeskApplication' }
